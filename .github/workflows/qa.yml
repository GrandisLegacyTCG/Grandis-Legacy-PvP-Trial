name: PvP S0 RC32 — S1 Lobby UI / S0 Content QA
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install websocket-client==1.8.0
      - run: npm run check
      - run: docker build -t gl-pvp-s0-test .
