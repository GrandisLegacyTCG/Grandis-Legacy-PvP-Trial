name: Grandis Legacy PvP S0 RC40 Patch 3.2 - NET RC6 Stage 2
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PVP_REQUIRE_WS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python for WebSocket integration test
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WebSocket QA dependency
        run: python -m pip install websocket-client==1.8.0
      - name: Install production Node dependencies (S1 ws transport)
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Build deterministic static compression
        run: npm run build:precompress
      - name: RC40 Patch 3.2 Item/Discard, Card Played, authority and response QA
        run: npm run check:rc40-p32
      - name: Historical regression, networking, privacy and HTTP
        run: npm run check
      - name: Verify Docker image can build
        run: docker build --pull -t grandis-legacy-pvp-s0-net-rc6:ci .
      - name: Verify native ws transport in Docker
        run: |
          docker run -d --rm --name gl-pvp-net-rc6 -e PVP_ALLOWED_ORIGINS=https://grandislegacytcg.web.id -p 3066:3000 grandis-legacy-pvp-s0-net-rc6:ci
          sleep 5
          node -e "fetch('http://127.0.0.1:3066/health').then(r=>r.json()).then(x=>{if(!x.ok||x.transport!=='ws'||x.version!=='S0-RC40-PVP-NET-RC6-STAGE2-PATCH3.2'||x.buildId!=='gl-s0-pvp-rc40-patch32-item-discard-2026-11-14')process.exit(1);console.log(x.transport,x.buildId)}).catch(()=>process.exit(1))"
          docker stop gl-pvp-net-rc6
