name: S1 Pregame to S0 Battle QA
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:syntax
      - run: npm run test:transition
      - run: docker build -t gl-pvp-s0-test .
