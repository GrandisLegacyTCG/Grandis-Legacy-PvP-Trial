name: Grandis Legacy PvP S0 RC34 - source and network QA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python for WebSocket integration test
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WebSocket QA dependency
        run: python -m pip install websocket-client==1.8.0
      - name: Build deterministic static compression
        run: npm run build:precompress
      - name: RC34 rules, multiplayer, Mana, privacy, assets, HTTP
        run: npm run check
      - name: Verify Docker image can build
        run: docker build --pull -t grandis-legacy-pvp-s0-rc34:ci .
