name: PvP Season 0 staging QA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rc32-and-network:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authoritative RC32 / room / privacy / full deck-out regressions
        run: npm run check
      - name: Verify Northflank Docker image can be built
        run: docker build --tag grandis-s0-pvp-preflight .
      - name: Start isolated container and exercise HTTP + native WebSocket smoke
        run: |
          docker run -d --rm --name grandis-s0-ci -p 127.0.0.1:39617:3000 grandis-s0-pvp-preflight
          trap 'docker logs grandis-s0-ci; docker stop grandis-s0-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:39617/health >/dev/null; then break; fi
            sleep 0.2
          done
          PVP_PUBLIC_URL=http://127.0.0.1:39617 npm run test:hosted
  browser-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium for native HTTP / WebSocket check
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Two native Chromium contexts exercising actual RC32 UI via real WS
        run: python tests/browser-native-smoke.py
